<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSS-PlotDot</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --container-bg: #ffffff;
            --text-color: #1a1a1a;
            --accent-color: #2c3e50;
            --sub-text: #666666;
            --border-color: #eaeaea;
            --transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        body.dark-theme {
            --bg-color: #0f0f0f;
            --container-bg: #1a1a1a;
            --text-color: #e0e0e0;
            --accent-color: #f1c40f;
            --sub-text: #a0a0a0;
            --border-color: #333333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            transition: var(--transition);
            line-height: 1.8;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 60px;
            text-align: center;
        }

        h1 {
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        button, select, input {
            border: none;
            background: none;
            color: var(--text-color);
            cursor: pointer;
            font-size: 14px;
            outline: none;
        }

        .feed-item {
            padding: 40px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .feed-item h2 {
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .date {
            font-size: 12px;
            letter-spacing: 1px;
            color: var(--sub-text);
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .feed-item p {
            color: var(--sub-text);
            font-size: 18px;
        }

        /* Анимация появления */
        .feed-item {
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>RSS Digest</h1>
        <div class="controls">
            <button onclick="toggleTheme()">Тема</button>
            <select id="fontSelect" onchange="changeFont(this.value)">
                <option value="'Helvetica Neue', sans-serif">Sans</option>
                <option value="'Georgia', serif">Serif</option>
            </select>
        </div>
    </header>

    <div id="rss-content">Загрузка...</div>
</div>

<script>
    function toggleTheme() {
        document.body.classList.toggle('dark-theme');
    }

    function changeFont(font) {
        document.body.style.fontFamily = font;
    }

    function changeSize(size) {
        document.body.style.fontSize = size + 'px';
    }

    async function loadRSS() {
        try {
            const response = await fetch('bin.rss');
            const str = await response.text();
            const xml = new DOMParser().parseFromString(str, "text/xml");
            const items = xml.querySelectorAll("item");
            
            let html = '';
            items.forEach(item => {
                const title = item.querySelector("title")?.textContent || "No Title";
                const desc = item.querySelector("description")?.textContent || "";
                const pubDate = new Date(item.querySelector("pubDate")?.textContent).toLocaleDateString('ru-RU', {day: 'numeric', month: 'long', year: 'numeric'});
                
                html += `
                    <article class="feed-item">
                        <div class="date">${pubDate}</div>
                        <h2>${title}</h2>
                        <p>${desc}</p>
                    </article>
                `;
            });
            document.getElementById('rss-content').innerHTML = html;
        } catch (e) {
            document.getElementById('rss-content').innerHTML = "Не удалось загрузить ленту.";
        }
    }

    loadRSS();
</script>
</body>
</html>
