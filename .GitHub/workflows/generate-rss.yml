name: Generate RSS

on:
  push:
    paths: ['news.json']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install feedgen
        run: pip install feedgen

      - name: Generate RSS
        run: |
          python generate_rss.py
          echo "=== DEBUG: File size ==="
          ls -lh bin.rss || echo "❌ bin.rss НЕ создан!"
          echo "=== DEBUG: First 10 lines ==="
          head -n 10 bin.rss || echo "❌ Файл пустой"

      - name: Commit & Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-update bin.rss"
          file_pattern: bin.rss
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
