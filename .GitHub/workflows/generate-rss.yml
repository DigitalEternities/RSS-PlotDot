name: Generate RSS

on:
  push:
    paths: ['news.json']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install feedgen
        run: pip install feedgen

      - name: Generate RSS
        run: |
          python generate_rss.py
          echo "=== DEBUG: File size ==="
          ls -lh bin.rss || echo "❌ bin.rss НЕ создан!"
          echo "=== DEBUG: First 10 lines ==="
          head -n 10 bin.rss || echo "❌ Файл пустой"

      - name: Commit & Push (Force)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin.rss
          git commit -m "🤖 Force update bin.rss" || echo "⚠️ Нет изменений для коммита"
          git push origin HEAD:${{ github.ref_name }} || echo "❌ Push заблокирован"
