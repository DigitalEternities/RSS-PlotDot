name: Generate RSS

on:
  push:
    paths:
      - 'news.json'
  workflow_dispatch: # Позволяет запустить вручную из вкладки Actions

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Критично! Разрешает git push через GITHUB_TOKEN

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install feedgen
        run: pip install feedgen

      - name: Generate bin.rss
        run: python generate_rss.py

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin.rss
          git diff --staged --quiet || git commit -m "🤖 Auto-update bin.rss from news.json"
          git push
